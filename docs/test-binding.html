<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binding regression test</title>
<style>
  :root { --paper:#EAE3D0; --ink:#212A38; --ok:#2F6B4F; --bad:#9C3B2A; --line:#c9c0a6; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px 48px; background:var(--paper); color:var(--ink);
         font:16px/1.5 "Newsreader", Georgia, serif; }
  main { max-width:720px; margin:0 auto; }
  h1 { font-size:26px; margin:0 0 4px; }
  p.sub { margin:0 0 20px; color:#4b5566; }
  #summary { font:600 15px "IBM Plex Mono", ui-monospace, monospace; padding:10px 12px;
             border:2px solid var(--ink); display:inline-block; margin-bottom:16px; }
  #summary.ok { color:var(--ok); border-color:var(--ok); }
  #summary.bad { color:var(--bad); border-color:var(--bad); }
  ol { list-style:none; padding:0; margin:0; border-top:1px solid var(--line); }
  li { padding:10px 0; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  .tag { font:600 12px "IBM Plex Mono", ui-monospace, monospace; padding:2px 6px; border:1.5px solid; flex:none; }
  .pass { color:var(--ok); } .fail { color:var(--bad); }
  .err { display:block; font:13px "IBM Plex Mono", ui-monospace, monospace; color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Binding regression test</h1>
  <p class="sub">The displayed product and the submitted action id cannot diverge, even with delayed or out-of-order lookups.
     Runs the same <code>binding.js</code> that <code>index.html</code> uses.</p>
  <div id="summary">running…</div>
  <ol id="list"></ol>
</main>
<script type="module">
  import { runAll } from "./binding.test.js";
  const results = await runAll();
  const list = document.getElementById("list");
  for (const r of results) {
    const li = document.createElement("li");
    const tag = document.createElement("span");
    tag.className = "tag " + (r.ok ? "pass" : "fail");
    tag.textContent = r.ok ? "PASS" : "FAIL";
    const text = document.createElement("span");
    text.textContent = r.name;
    if (!r.ok) {
      const e = document.createElement("span");
      e.className = "err";
      e.textContent = r.error;
      text.appendChild(e);
    }
    li.append(tag, text);
    list.appendChild(li);
  }
  const n = results.filter((r) => r.ok).length;
  const s = document.getElementById("summary");
  s.textContent = `${n}/${results.length} pass`;
  s.className = n === results.length ? "ok" : "bad";
</script>
</body>
</html>
