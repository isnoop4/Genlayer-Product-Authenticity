<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GenLayer Product Registry</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 20px; }
    hr   { margin: 20px 0; border: 0; border-top: 1px solid #ddd; }
    .hint { color: #777; }
    .st   { font-weight: bold; }
    .st.s-active   { color: green; }
    .st.s-inactive { color: gray; }
  </style>
</head>
<body>
  <h1>Product Registry</h1>

  <div>
    Total: <span id="regCount">0</span>
    <button id="btnReload">Refresh List</button>
  </div>

  <ul id="reg"></ul>

  <hr>

  <h2>Lookup product</h2>
  <input id="lookupId" placeholder="product id">
  <button id="btnLoad">Load</button>

  <hr>

  <h2>Deposit GEN</h2>
  <input id="depAmt" type="number" placeholder="amount (1-10000)">
  <button id="btnDep">Deposit</button>

  <hr>

  <h2>Register product</h2>
  <input id="rId"     placeholder="product id">
  <input id="rOrigin" placeholder="origin">
  <input id="rUrl"    placeholder="evidence URL">
  <button id="btnReg">Register</button>

  <script type="module">
    /* -------------------------------------------------
       Helper utilities
    ------------------------------------------------- */
    const $   = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;",
    })[c]);

    // Placeholder SDK functions / globals - provided by the GenLayer SDK
    // in the real page:
    //   read(method, params?)  -> Promise<object>
    //   sendTx(method, params) -> Promise<txHash>
    //   refreshBalance()       -> updates UI
    //   loadProduct(id)        -> fetch & display a single product
    //   renderCert()           -> optional UI helper
    //   log(message, type?)    -> console log + optional UI output
    //   safeHttpUrl(str)       -> simple URL validator
    //   studioDevnet           -> info about the selected chain

    /* -------------------------------------------------
       Core logic
    ------------------------------------------------- */
    async function loadList() {
      try {
        // Adjust the call to match your contract signature.
        // If get_products takes (offset, limit):
        //   const result = await read("get_products", [0n, 50n]);
        // If it takes no parameters:
        const result = await read("get_products");

        const total = Number(result.total ?? 0);
        const items = Array.isArray(result.items) ? result.items : [];

        $("regCount").textContent = `${total}`;

        const list = $("reg");
        if (!items.length) {
          list.innerHTML = `<li class="hint">No products yet.</li>`;
          return;
        }

        // NOTE: field names below (productid, claimedorigin) match the
        // original code. Rename to product_id / claimed_origin if that is
        // what your contract returns.
        list.innerHTML = items
          .slice()
          .reverse()
          .map((item) => `
            <li>
              <button type="button" data-id="${esc(item.productid)}">
                <span>
                  ${esc(item.productid)}
                  <span class="hint">${esc(item.claimedorigin)}</span>
                </span>
                <span class="st s-${esc(item.status)}">${esc(item.status)}</span>
              </button>
            </li>
          `)
          .join("");

        list.querySelectorAll("button[data-id]").forEach((button) => {
          button.onclick = () => loadProduct(button.dataset.id);
        });
      } catch (error) {
        $("reg").innerHTML =
          `<li class="hint">Could not load the list. Check Activity for the RPC error.</li>`;
        log(
          "getproducts failed: " +
          (error?.shortMessage || error?.message || String(error)),
          "err"
        );
      }
    }

    /* -------------------------------------------------
       UI event bindings
    ------------------------------------------------- */

    // Load a single product by id
    $("btnLoad").onclick = () => loadProduct($("lookupId").value.trim());

    // Press Enter in the lookup field
    $("lookupId").addEventListener("keydown", (event) => {
      if (event.key === "Enter") loadProduct($("lookupId").value.trim());
    });
    $("lookupId").addEventListener("input", renderCert);

    // Refresh the whole list
    $("btnReload").onclick = loadList;

    // Deposit GEN
    $("btnDep").onclick = async () => {
      try {
        const amount = Number($("depAmt").value);
        if (!Number.isInteger(amount) || amount < 1 || amount > 10000) {
          throw new Error("Amount must be a whole number from 1 to 10000.");
        }
        await sendTx("deposit", [BigInt(amount)]);
        await refreshBalance();
      } catch (error) {
        log(
          "Deposit failed: " +
          (error?.shortMessage || error?.message || String(error)),
          "err"
        );
      }
    };

    // Register a new product
    $("btnReg").onclick = async () => {
      try {
        const id     = $("rId").value.trim();
        const origin = $("rOrigin").value.trim();
        const url    = $("rUrl").value.trim();

        if (!id || !origin || !safeHttpUrl(url)) {
          throw new Error("Fill all fields; the evidence URL must be a valid http(s) URL.");
        }

        await sendTx("registerproduct", [id, origin, url]);

        // Refresh list and balance concurrently, then show the newly added product
        await Promise.all([loadList(), refreshBalance()]);
        await loadProduct(id);
      } catch (error) {
        log(
          "Register failed: " +
          (error?.shortMessage || error?.message || String(error)),
          "err"
        );
      }
    };

    /* -------------------------------------------------
       Startup
    ------------------------------------------------- */
    console.log(
      `SDK chain selected: ${studioDevnet?.name || "studioDevnet"} ` +
      `(id ${studioDevnet?.id ?? "unknown"})`
    );
    loadList();
  </script>
</body>
</html>
